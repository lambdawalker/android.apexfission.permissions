name: Device permission tests

on:
  push:
    paths:
      - '.github/workflows/device-permission-tests.yml'
      - 'app/**'
      - 'permission/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
  pull_request:
    paths:
      - '.github/workflows/device-permission-tests.yml'
      - 'app/**'
      - 'permission/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile app and instrumentation tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run JVM unit tests
        run: ./gradlew :permission:testDebugUnitTest :app:testDebugUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run tests on API ${{ matrix.api-level }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Upload device results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: permission-device-results-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
