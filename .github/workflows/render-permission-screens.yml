name: Render permission screens

on:
  push:
    paths:
      - '.github/workflows/render-permission-screens.yml'
      - 'permission/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Render Compose previews
        run: ./gradlew :permission:testDebugUnitTest :permission:updateDebugScreenshotTest :app:assembleDebug --stacktrace
      - name: Upload PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: permission-screen-images
          path: permission/src/screenshotTestDebug/reference/**/*.png
          if-no-files-found: warn
