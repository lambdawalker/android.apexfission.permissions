name: Library site

on:
  pull_request:
    paths:
      - 'IMPORT.md'
      - 'app/src/main/java/com/apexfission/android/permissions/demo/CameraQuickstartActivity.kt'
      - 'sites/**'
      - 'docs/screenshots/**'
      - 'docs/agents/**'
      - 'docs/es/**'
      - 'docs/releases/**'
      - 'scripts/documentation_history.py'
      - 'scripts/import_docs.py'
      - 'publishing/legacy-installation.json'
      - '.github/workflows/deploy-library-site.yml'
  push:
    branches: [main]
    paths:
      - 'IMPORT.md'
      - 'app/src/main/java/com/apexfission/android/permissions/demo/CameraQuickstartActivity.kt'
      - 'sites/**'
      - 'docs/screenshots/**'
      - 'docs/agents/**'
      - 'docs/es/**'
      - 'docs/releases/**'
      - 'scripts/documentation_history.py'
      - 'scripts/import_docs.py'
      - 'publishing/legacy-installation.json'
      - '.github/workflows/deploy-library-site.yml'
  workflow_run:
    workflows: [Publish permission library, Finalize permission release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-site-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    if: (github.event_name != 'workflow_run' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')) || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sites/package-lock.json
      - name: Install and build
        working-directory: sites
        run: |
          npm ci
          npm run check
      - name: Reject stale deployment source
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: sites/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
