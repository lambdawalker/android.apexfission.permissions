name: Publish permission library

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Maven version to stage (for example, 0.2.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-permission
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: maven-central
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release input and credentials
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Use a Maven version such as 0.2.0 or 0.2.0-B1" >&2
            exit 1
          fi
          for name in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            if [[ -z "${!name}" ]]; then
              echo "Missing release credential: $name" >&2
              exit 1
            fi
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and assemble
        run: ./gradlew :permission:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Stage signed artifact on Maven Central
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./gradlew :permission:publishToMavenCentral "-PpermissionVersion=$RELEASE_VERSION" --stacktrace
