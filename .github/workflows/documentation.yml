name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["SUB - Finalize Permissions release","Publish"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          fetch-depth: 0
          lfs: true
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install pinned documentation tooling
        run: cargo install --locked --git https://github.com/lambdawalker/gradle.android-repo-setup.git --tag v0.1.16 android-repo-docs
      - run: android-repo-docs check
      - name: Install pinned Zola
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/zola-0.23.6"
          archive="$RUNNER_TEMP/zola-0.23.6.tar.gz"
          curl --fail --show-error --silent --location --retry 3 \
            https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          echo "8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4  $archive" | sha256sum -c -
          mkdir -p "$directory"
          tar -xzf "$archive" -C "$directory"
          test "$("$directory/zola" --version)" = 'zola 0.23.6'
          echo "$directory" >> "$GITHUB_PATH"
      - run: "sh sites/tests/landing.sh"
      - run: "android-repo-docs screenshots manifest"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: sites/dist
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - id: current
        env:
          BUILT_SHA: ${{ needs.build.outputs.source }}
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" = "$BUILT_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Main advanced; skip stale build. A newer run or manual dispatch will deploy.'
          fi
      - uses: actions/deploy-pages@v5
        id: deployment
        if: steps.current.outputs.deploy == 'true'
