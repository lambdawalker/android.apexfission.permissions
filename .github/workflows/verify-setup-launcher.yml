name: Verify Windows setup launcher
on:
  pull_request:
    paths: ['setup.bat', '.github/workflows/verify-setup-launcher.yml']
  push:
    branches: [main]
    paths: ['setup.bat', '.github/workflows/verify-setup-launcher.yml']
permissions:
  contents: read
jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check paths, arguments, pinned revisions and failures
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'setup fixture'
          $bin = Join-Path $root 'mock bin'
          New-Item -ItemType Directory -Force "$root/.project/setup", $bin | Out-Null
          Copy-Item setup.bat "$root/setup.bat"
          '@echo off', 'echo %* > "%SETUP_TEST_LOG%\cargo.txt"', 'exit /b %SETUP_TEST_INSTALL_EXIT%' | Set-Content "$bin/cargo.bat"
          '@echo off', 'echo %* > "%SETUP_TEST_LOG%\cli.txt"', 'exit /b 23' | Set-Content "$bin/android-repo-setup.bat"
          $env:PATH = "$bin;$env:PATH"
          $env:SETUP_TEST_LOG = $root
          $env:SETUP_TEST_INSTALL_EXIT = '0'
          Set-Location $env:RUNNER_TEMP
          "tooling_ref: 'v0.1.11'" | Set-Content "$root/.project/setup/config.yaml"
          & "$root/setup.bat" '--example' 'argument with spaces'
          if ($LASTEXITCODE -ne 23) { throw 'CLI exit code was not forwarded' }
          if ((Get-Content "$root/cargo.txt" -Raw) -notmatch '--tag v0.1.11') { throw 'Release pin missing' }
          $argsLog = Get-Content "$root/cli.txt" -Raw
          if (-not $argsLog.Contains('--project "' + $root + '\."')) { throw "Project path missing: $argsLog" }
          if (-not $argsLog.Contains('"argument with spaces"')) { throw 'Argument boundaries lost' }
          Remove-Item "$root/cli.txt"
          $env:SETUP_TEST_INSTALL_EXIT = '17'
          & "$root/setup.bat"
          if ($LASTEXITCODE -ne 17 -or (Test-Path "$root/cli.txt")) { throw 'Install failure was ignored' }
          $env:SETUP_TEST_INSTALL_EXIT = '0'
          $revision = 'a' * 40
          "tooling_ref: '$revision'" | Set-Content "$root/.project/setup/config.yaml"
          & "$root/setup.bat"
          if ($LASTEXITCODE -ne 23 -or (Get-Content "$root/cargo.txt" -Raw) -notmatch "--rev $revision") { throw 'Source pin failed' }
          Remove-Item "$root/cargo.txt", "$root/cli.txt"
          "tooling_ref: 'invalid'" | Set-Content "$root/.project/setup/config.yaml"
          & "$root/setup.bat"
          if ($LASTEXITCODE -ne 1 -or (Test-Path "$root/cargo.txt")) { throw 'Invalid pin accepted' }
          exit 0
